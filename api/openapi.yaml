openapi: 3.0.3
info:
  title: Barbershop API
  version: 0.1.0
  description: |
    HTTP API for the barbershop booking platform (Saudi Arabia / GCC).
    This file is the source of truth: the Go server interface is generated from
    it (`make generate`), and so will the Flutter client be. Change the spec
    first, then the code. Conventions: docs/api/overview.md.

    Errors are RFC 9457 `application/problem+json` with a stable `code`.

    Authentication: every operation needs `Authorization: Bearer <access_token>`
    unless it declares `security: []`. Access tokens live 15 minutes; renew
    them with `POST /v1/auth/refresh`. A `401 unauthorized` from a protected
    operation means "refresh, then retry once".
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: auth
    description: Phone number + one-time code login, tokens and sessions
  - name: me
    description: The signed-in user
  - name: businesses
    description: Business mode — register and run a barbershop business (tenant)
  - name: branches
    description: Business mode — a business's shops, with location and booking policy

# Protected by default: an operation is public only if it says `security: []`.
security:
  - bearerAuth: []

paths:
  /v1/auth/otp/request:
    post:
      operationId: requestOTP
      tags: [auth]
      security: []
      summary: Send a one-time login code by SMS
      description: |
        Sends a 6-digit code to the phone number. The answer is the same
        whether or not the number already has an account, so the endpoint
        can't be used to discover who is registered.

        Limits: one code per number per `resend_after_seconds`, and a few
        codes per number per hour (`429 otp_cooldown` / `429 rate_limited`).
        Ten failed verifications within 15 minutes lock the number for 15 minutes
        (`429 otp_locked`, with `Retry-After`), including requests for new codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPRequest"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPRequested"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/otp/verify:
    post:
      operationId: verifyOTP
      tags: [auth]
      security: []
      summary: Check a one-time code and sign in (registering new numbers)
      description: |
        A correct code signs the user in; a number seen for the first time
        becomes a new user (`is_new_user: true`). Each code works once, expires
        after a few minutes and allows a few attempts
        (`401 otp_invalid`, `401 otp_expired`, `429 otp_too_many_attempts`).
        Ten failed verifications within 15 minutes lock the number for 15 minutes
        (`429 otp_locked`, with `Retry-After`). New codes do not reset failures;
        a successful verification or expiration of the failure window does.

        Signing in starts a session: the response carries an access token and
        a refresh token (`tokens`).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerify"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Login"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      security: []
      summary: Exchange a refresh token for a new token pair
      description: |
        Every refresh token works once: the answer carries a new refresh token
        that replaces it. Presenting an already-used refresh token means it
        was copied, so the whole session is ended (`401 refresh_token_reused`)
        and the user must sign in again. Unknown, expired or signed-out tokens
        get `401 refresh_token_invalid`.

        Clients must not refresh twice in parallel with the same token (for
        example two requests that both got `401`): the second call would look
        like reuse. Share one refresh between concurrent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of this session
      description: |
        Ends the caller's session: its refresh token stops working at once.
        The current access token stays valid until it expires (at most 15
        minutes), so the app should drop it too. Calling it twice is fine.
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me/memberships:
    get:
      operationId: listMyMemberships
      tags: [me]
      summary: The businesses the signed-in user works in, and their role
      description: |
        Drives the app's "Business mode" switch: an empty list means the user
        is only a customer. Every business a user registers appears here with
        the role `owner`. A user belongs to a handful of businesses at most,
        so the list is not paginated.
      responses:
        "200":
          description: The memberships, newest business first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses:
    post:
      operationId: registerBusiness
      tags: [businesses]
      summary: Register a business (starts as a draft)
      description: |
        Creates a business in `draft` status with the caller as its owner.
        A draft is private to its staff; customers see nothing until the
        platform approves it (submission and review arrive later in M3).

        The CR number (Saudi Commercial Registration, 10 digits) is checked
        for format only. It is claimed — made unique across the platform —
        when the business is submitted for review, so nobody can block a
        real shop by registering its number as a draft (ADR-0015). Registering
        the same CR number twice as the same owner is refused with
        `409 business_already_registered`, which also makes a retried request
        safe: list `/v1/me/memberships` to find the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: A business, for its owner
      description: |
        Owner only. Callers who are not staff of the business get
        `404 not_found` — the same answer as for a business that doesn't
        exist, so IDs can't be probed. Staff without the owner role get
        `403 forbidden`.
      responses:
        "200":
          description: The business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Edit a business's names (owner, while draft or rejected)
      description: |
        Owner only, with the same `404` / `403` rules as `GET`. Send only the
        fields that change; `display_name` is replaced as a whole (an omitted
        `en` clears the English name).

        Names can change only while the business is `draft` or `rejected`
        (`409 invalid_state_transition` otherwise): after submission the
        reviewer checks them against the CR document.

        `If-Match` carries the `version` you last read. If someone changed the
        business since, nothing is saved and you get
        `412 version_conflict`: reload, reapply, retry. On success `version`
        goes up by one.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: The updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: listBranches
      tags: [branches]
      summary: The business's branches
      description: |
        Any active staff member of the business may list its branches;
        everyone else gets `404 not_found`. A business has a handful of
        branches (its plan caps them), so the list is not paginated.
      responses:
        "200":
          description: The branches, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Add a branch (owner)
      description: |
        Creates a `draft` branch. Customers can't see it until it is
        published, which needs an approved business, services and barbers
        (later milestones). Omitted `timezone` means `Asia/Riyadh`; omitted
        `booking_policy` means the defaults shown in the `BookingPolicy` schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: getBranch
      tags: [branches]
      summary: One branch (any staff of the business)
      description: |
        A branch is only found inside its own business: a branch ID from
        another business gets `404 not_found`, like an ID that doesn't exist.
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBranch
      tags: [branches]
      summary: Edit a branch (owner)
      description: |
        Send only the fields that change. `name`, `location` and
        `booking_policy` are replaced as a whole; an empty `district` or
        `phone` clears it. `If-Match` carries the `version` you last read
        (`412 version_conflict` if the branch changed since).

        Owners only for now: managers will edit the branches they are
        assigned to once staff invitations exist (M3.5).
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdate"
      responses:
        "200":
          description: The updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `tokens.access_token` (sign-in or refresh).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred language (`ar` default, `en`). Also the language saved for new users.
      schema:
        type: string
        example: ar-SA

    BusinessID:
      name: business_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BranchID:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: The `version` you last read, e.g. `3` or `"3"`.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        example: '"3"'

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      headers:
        Retry-After:
          description: Seconds to wait before retrying (only on 429)
          schema:
            type: integer
        WWW-Authenticate:
          description: 'Bearer challenge (only on 401 from protected operations)'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Too Many Requests
        status:
          type: integer
          example: 429
        code:
          type: string
          description: |
            Stable machine-readable error code. Known values:
            `validation_failed`, `not_found`, `method_not_allowed`, `internal`,
            `not_ready`, `rate_limited`, `otp_cooldown`, `otp_invalid`,
            `otp_expired`, `otp_too_many_attempts`, `otp_locked`, `user_blocked`,
            `unauthorized`, `refresh_token_invalid`, `refresh_token_reused`,
            `forbidden`, `business_already_registered`, `invalid_state_transition`,
            `version_conflict`.
          example: otp_cooldown
        detail:
          type: string
        request_id:
          type: string

    OTPRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 64
          description: Saudi mobile number in any common format (05…, +9665…, Arabic-Indic digits).
          example: "0551234567"

    OTPRequested:
      type: object
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds:
          type: integer
          example: 300
        resend_after_seconds:
          type: integer
          example: 60

    OTPVerify:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 64
          example: "0551234567"
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: The 6-digit code (Western or Arabic-Indic digits).
          example: "482193"

    Login:
      type: object
      required: [user, is_new_user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        is_new_user:
          type: boolean
          description: True when this verification created the account (show onboarding).
        tokens:
          $ref: "#/components/schemas/TokenPair"

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: 'Send as `Authorization: Bearer <access_token>`.'
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        refresh_token:
          type: string
          description: Single use. Store it in the device's secure storage only.
        refresh_expires_in:
          type: integer
          description: Seconds until the refresh token expires if unused.
          example: 2592000

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 256

    User:
      type: object
      required: [id, phone, locale, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+966551234567"
        name:
          type: string
          nullable: true
          example: عبدالرحمن
        locale:
          type: string
          enum: [ar, en]
        created_at:
          type: string
          format: date-time

    LocalizedText:
      type: object
      additionalProperties: false
      required: [ar]
      description: Text in Arabic (required) and English (optional).
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 100
          example: صالون الأناقة
        en:
          type: string
          maxLength: 100
          example: Elegance Barbers

    BusinessRegistration:
      type: object
      additionalProperties: false
      required: [display_name, legal_name, cr_number]
      properties:
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The name on the Commercial Registration.
          example: مؤسسة الأناقة للحلاقة
        cr_number:
          type: string
          minLength: 10
          maxLength: 20
          description: 10-digit Commercial Registration number (Western or Arabic-Indic digits; spaces allowed).
          example: "1010123456"

    BusinessUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; at least one.
      properties:
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
          minLength: 1
          maxLength: 200

    BusinessStatus:
      type: string
      enum: [draft, pending_review, active, rejected, suspended]
      description: |
        `draft` → `pending_review` (submitted) → `active` (approved) or
        `rejected` (fix and resubmit); `active` ↔ `suspended` by the platform.

    StaffRole:
      type: string
      enum: [owner, manager, barber]

    Business:
      type: object
      required: [id, display_name, legal_name, cr_number, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
        cr_number:
          type: string
          example: "1010123456"
        status:
          $ref: "#/components/schemas/BusinessStatus"
        version:
          type: integer
          description: Increases on every change; send it as `If-Match` when editing.
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BusinessSummary:
      type: object
      required: [id, display_name, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/BusinessStatus"

    Membership:
      type: object
      required: [business, staff_id, role]
      properties:
        business:
          $ref: "#/components/schemas/BusinessSummary"
        staff_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StaffRole"

    MembershipList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 24.6911
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 46.6851

    BookingPolicy:
      type: object
      additionalProperties: false
      description: How a branch takes bookings. Defaults are shown as examples.
      required: [min_lead_minutes, horizon_days, slot_interval_minutes, buffer_minutes, cancellation_window_minutes, auto_confirm, pending_expiry_minutes, max_active_bookings]
      properties:
        min_lead_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: Earliest booking is now + this.
          example: 30
        horizon_days:
          type: integer
          minimum: 1
          maximum: 180
          description: Latest booking is today + this.
          example: 30
        slot_interval_minutes:
          type: integer
          enum: [5, 10, 15, 20, 30, 60]
          description: Start times are offered every this many minutes.
          example: 15
        buffer_minutes:
          type: integer
          minimum: 0
          maximum: 60
          description: Cleanup time after each appointment.
          example: 0
        cancellation_window_minutes:
          type: integer
          minimum: 0
          maximum: 2880
          description: Customers may cancel until this long before the start.
          example: 120
        auto_confirm:
          type: boolean
          description: False means the shop confirms each booking.
          example: true
        pending_expiry_minutes:
          type: integer
          minimum: 5
          maximum: 120
          description: An unconfirmed booking expires after this (only when auto_confirm is false).
          example: 15
        max_active_bookings:
          type: integer
          minimum: 1
          maximum: 10
          description: Future bookings one customer may hold at this branch.
          example: 2

    BranchCreate:
      type: object
      additionalProperties: false
      required: [name, city_code, address, location]
      properties:
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          pattern: "^[a-z][a-z_]{1,39}$"
          description: A city from the app's list, e.g. `riyadh`, `jeddah`, `al_khobar`.
          example: riyadh
        district:
          type: string
          maxLength: 80
          example: العليا
        address:
          type: string
          minLength: 1
          maxLength: 200
          example: شارع العليا العام
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          maxLength: 64
          description: Saudi mobile number in any common format.
          example: "0551234567"
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone of the branch (default `Asia/Riyadh`).
          example: Asia/Riyadh
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"

    BranchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; at least one.
      properties:
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          pattern: "^[a-z][a-z_]{1,39}$"
        district:
          type: string
          maxLength: 80
          description: Empty clears it.
        address:
          type: string
          minLength: 1
          maxLength: 200
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          maxLength: 64
          description: Empty clears it.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"

    BranchStatus:
      type: string
      enum: [draft, published, unpublished]

    Branch:
      type: object
      required: [id, business_id, name, city_code, address, location, timezone, booking_policy, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          example: riyadh
        district:
          type: string
          nullable: true
        address:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          nullable: true
          example: "+966551234567"
        timezone:
          type: string
          example: Asia/Riyadh
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"
        status:
          $ref: "#/components/schemas/BranchStatus"
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BranchList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Branch"
