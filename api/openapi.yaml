openapi: 3.0.3
info:
  title: Barbershop API
  version: 0.1.0
  description: |
    HTTP API for the barbershop booking platform (Saudi Arabia / GCC).
    This file is the source of truth: the Go server interface is generated from
    it (`make generate`), and so will the Flutter client be. Change the spec
    first, then the code. Conventions: docs/api/overview.md.

    Errors are RFC 9457 `application/problem+json` with a stable `code`.

    Authentication: every operation needs `Authorization: Bearer <access_token>`
    unless it declares `security: []`. Access tokens live 15 minutes; renew
    them with `POST /v1/auth/refresh`. A `401 unauthorized` from a protected
    operation means "refresh, then retry once".
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: auth
    description: Phone number + one-time code login, tokens and sessions
  - name: me
    description: The signed-in user
  - name: businesses
    description: Business mode — register and run a barbershop business (tenant)
  - name: branches
    description: Business mode — a business's shops, with location and booking policy
  - name: staff
    description: Business mode — a business's team, and inviting people to it
  - name: services
    description: What a branch sells — its service menu, with prices and durations
  - name: scheduling
    description: When work can happen — branch opening hours, barber schedules, time off
  - name: booking
    description: Customers — when a branch can do some services, and booking them
  - name: discovery
    description: Customers — finding branches (public)
  - name: media
    description: Stored files, served through short-lived signed links
  - name: admin
    description: Platform administration (platform admins only)

# Protected by default: an operation is public only if it says `security: []`.
security:
  - bearerAuth: []

paths:
  /v1/auth/otp/request:
    post:
      operationId: requestOTP
      tags: [auth]
      security: []
      summary: Send a one-time login code by SMS
      description: |
        Sends a 6-digit code to the phone number. The answer is the same
        whether or not the number already has an account, so the endpoint
        can't be used to discover who is registered.

        Limits: one code per number per `resend_after_seconds`, and a few
        codes per number per hour (`429 otp_cooldown` / `429 rate_limited`).
        Ten failed verifications within 15 minutes lock the number for 15 minutes
        (`429 otp_locked`, with `Retry-After`), including requests for new codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPRequest"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPRequested"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/otp/verify:
    post:
      operationId: verifyOTP
      tags: [auth]
      security: []
      summary: Check a one-time code and sign in (registering new numbers)
      description: |
        A correct code signs the user in; a number seen for the first time
        becomes a new user (`is_new_user: true`). Each code works once, expires
        after a few minutes and allows a few attempts
        (`401 otp_invalid`, `401 otp_expired`, `429 otp_too_many_attempts`).
        Ten failed verifications within 15 minutes lock the number for 15 minutes
        (`429 otp_locked`, with `Retry-After`). New codes do not reset failures;
        a successful verification or expiration of the failure window does.

        Signing in starts a session: the response carries an access token and
        a refresh token (`tokens`).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerify"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Login"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags: [auth]
      security: []
      summary: Exchange a refresh token for a new token pair
      description: |
        Every refresh token works once: the answer carries a new refresh token
        that replaces it. Presenting an already-used refresh token means it
        was copied, so the whole session is ended (`401 refresh_token_reused`)
        and the user must sign in again. Unknown, expired or signed-out tokens
        get `401 refresh_token_invalid`.

        Clients must not refresh twice in parallel with the same token (for
        example two requests that both got `401`): the second call would look
        like reuse. Share one refresh between concurrent requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of this session
      description: |
        Ends the caller's session: its refresh token stops working at once.
        The current access token stays valid until it expires (at most 15
        minutes), so the app should drop it too. Calling it twice is fine.
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"

  /v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me/memberships:
    get:
      operationId: listMyMemberships
      tags: [me]
      summary: The businesses the signed-in user works in, and their role
      description: |
        Drives the app's "Business mode" switch: an empty list means the user
        is only a customer. Every business a user registers appears here with
        the role `owner`. A user belongs to a handful of businesses at most,
        so the list is not paginated.
      responses:
        "200":
          description: The memberships, newest business first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses:
    post:
      operationId: registerBusiness
      tags: [businesses]
      summary: Register a business (starts as a draft)
      description: |
        Creates a business in `draft` status with the caller as its owner.
        A draft is private to its staff; customers see nothing until the
        platform approves it (submission and review arrive later in M3).
        A user has at most 3 businesses not yet approved (draft, under
        review or rejected): `409 registration_limit_reached`.

        The CR number (Saudi Commercial Registration, 10 digits) is checked
        for format only. It is claimed — made unique across the platform —
        when the business is submitted for review, so nobody can block a
        real shop by registering its number as a draft (ADR-0015). Registering
        the same CR number twice as the same owner is refused with
        `409 business_already_registered`, which also makes a retried request
        safe: list `/v1/me/memberships` to find the business.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: getBusiness
      tags: [businesses]
      summary: A business, for its owner
      description: |
        Owner only. Callers who are not staff of the business get
        `404 not_found` — the same answer as for a business that doesn't
        exist, so IDs can't be probed. Staff without the owner role get
        `403 forbidden`.
      responses:
        "200":
          description: The business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBusiness
      tags: [businesses]
      summary: Edit a business's names (owner, while draft or rejected)
      description: |
        Owner only, with the same `404` / `403` rules as `GET`. Send only the
        fields that change; `display_name` is replaced as a whole (an omitted
        `en` clears the English name).

        Names can change only while the business is `draft` or `rejected`
        (`409 invalid_state_transition` otherwise): after submission the
        reviewer checks them against the CR document.

        `If-Match` carries the `version` you last read. If someone changed the
        business since, nothing is saved and you get
        `412 version_conflict`: reload, reapply, retry. On success `version`
        goes up by one.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessUpdate"
      responses:
        "200":
          description: The updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: listBranches
      tags: [branches]
      summary: The business's branches
      description: |
        Any active staff member of the business may list its branches;
        everyone else gets `404 not_found`. A business has a handful of
        branches (its plan caps them), so the list is not paginated.
      responses:
        "200":
          description: The branches, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Add a branch (owner)
      description: |
        Creates a `draft` branch. Customers can't see it until it is
        published, which needs an approved business, services and barbers
        (later milestones). Omitted `timezone` means `Asia/Riyadh`; omitted
        `booking_policy` means the defaults shown in the `BookingPolicy` schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: getBranch
      tags: [branches]
      summary: One branch (any staff of the business)
      description: |
        A branch is only found inside its own business: a branch ID from
        another business gets `404 not_found`, like an ID that doesn't exist.
      responses:
        "200":
          description: The branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBranch
      tags: [branches]
      summary: Edit a branch (owner, or a manager of the branch)
      description: |
        Send only the fields that change. `name`, `location` and
        `booking_policy` are replaced as a whole; an empty `district` or
        `phone` clears it. `If-Match` carries the `version` you last read
        (`412 version_conflict` if the branch changed since).

        The owner may edit every branch; a manager only the branches they
        work at (`403 forbidden` for the others). Barbers can't edit.
        Only the owner changes `timezone` (`403 forbidden` for a manager):
        opening hours and schedules are wall-clock times in it, so they all
        move with it.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchUpdate"
      responses:
        "200":
          description: The updated branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/publish:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    post:
      operationId: publishBranch
      tags: [branches]
      summary: Show a branch to customers (owner)
      description: |
        `draft` or `unpublished` → `published`. The business must be
        `active` (`409 business_not_active`), and the branch able to take a
        booking: it has opening hours, an active service that a barber
        performs, and one of those barbers has a weekly schedule there.
        Anything missing: `409 branch_not_ready`, with a `detail` listing
        what to do. Already published: `409 invalid_state_transition`.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: The published branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/unpublish:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    post:
      operationId: unpublishBranch
      tags: [branches]
      summary: Hide a published branch from customers (owner)
      description: |
        `published` → `unpublished`; anything else is
        `409 invalid_state_transition`. Bookings already made stay; no new
        ones can be made. Publish again when ready.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: The unpublished branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/subscription:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: getSubscription
      tags: [businesses]
      summary: The business's plan, limits and trial (owner)
      description: |
        Before approval (`setup`) a business sets up under the Pro plan's
        limits. Approval starts a 30-day Pro trial (`trialing`) — a moment
        after the approval, as the trial is started by a background job.
        When the trial ends the business is on the Free plan (`free`).

        Limits are checked when adding: a branch past `max_branches` or an
        invitation past `max_staff` gets `409 plan_limit_reached`. Nothing
        is removed when a plan shrinks.
      responses:
        "200":
          description: The subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/staff:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: listStaff
      tags: [staff]
      summary: The business's team (owner and managers)
      description: |
        Everyone who works at the business, with their role and branches.
        People who haven't accepted their invitation yet are listed under
        `/staff/invitations` instead. A shop's team is small, so the list is
        not paginated.
      responses:
        "200":
          description: The staff, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMemberList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/staff/invitations:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: listStaffInvitations
      tags: [staff]
      summary: Invitations waiting for an answer (owner)
      description: Pending invitations, including ones past `expires_at` (revoke or resend those).
      responses:
        "200":
          description: The pending invitations, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitationList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite a manager or barber by phone (owner)
      description: |
        Texts the phone a link that works for 7 days. The invitee opens it,
        signs in with that same phone number and accepts
        (`POST /v1/invitations/accept`). The link itself is never returned
        here: only the invited phone receives it.

        Inviting a phone that already has a pending invitation replaces it
        (the old link stops working) — that is how to resend one. Every
        branch in `branch_ids` must belong to the business
        (`422 validation_failed` otherwise).

        Each invitation is an SMS, so they are limited: one a minute to a
        phone from a business, 5 a day to a phone from all businesses, 50 a
        day from a business (`429 rate_limited`, with `Retry-After`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInvitationCreate"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffInvitation"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/staff/invitations/{invitation_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/InvitationID"
    delete:
      operationId: revokeStaffInvitation
      tags: [staff]
      summary: Revoke a pending invitation (owner)
      description: Its link stops working. An accepted or already revoked invitation gets `409 invitation_closed`.
      responses:
        "204":
          description: Revoked
        default:
          $ref: "#/components/responses/Problem"

  /v1/invitations/accept:
    post:
      operationId: acceptStaffInvitation
      tags: [staff]
      summary: Join a business with an invitation token
      description: |
        The caller must be signed in with the phone number that was invited:
        the token alone is not enough. An unknown, expired, revoked or used
        token, or the wrong phone, all get the same `404 invitation_invalid`.
        Someone already on the business's staff gets `409 already_staff`.
        On success the business appears in `/v1/me/memberships`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        default:
          $ref: "#/components/responses/Problem"

  /v1/cities:
    get:
      operationId: listCities
      tags: [discovery]
      summary: Cities (public)
      description: |
        Platform reference data, in the order the app lists them (the
        largest first). A branch is filed under one (`city_code`), and
        customers browse by them.
      security: []
      responses:
        "200":
          description: The cities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/branches:
    get:
      operationId: searchBranches
      tags: [discovery]
      summary: Find branches (public)
      description: |
        Published branches, 20 a page. Pass `next_cursor` from a page as
        `cursor` to get the next one (with the same search).

        - **Near a place** (`lat` and `lng`): the branches within
          `radius_km`, nearest first, each with its `distance_m`.
        - **By name** (`q`): branches whose Arabic or English name contains
          `q` or is close to it (a letter off), best match first. Spelling
          variants match: أ إ آ and ا, ة and ه, ى and ي, short vowels,
          tatweel, upper and lower case.
        - **In a city** (`city` alone): its branches by Arabic name.

        They combine: `city` keeps only that city's branches, and `q` with
        a place keeps only matching names, still nearest first. `category`
        narrows any of them to the branches offering a service of that kind.

        Only branches offering a service customers can choose (active, with
        a barber) are shown. Each comes with `price_from`, the least a
        customer pays for a service there (for one of `category`'s, if
        given), and `open_now`, whether it is open at this moment by its
        weekly hours in its own time zone. `open_now=true` keeps only those.

        None of a city, a place or a name, only one of `lat` and `lng`, or a
        `q` with fewer than two letters or digits: `400`.

        A list kept from the businesses' changes: a branch appears or
        changes here moments after its owner publishes or edits it, or
        changes its services or opening hours.

        A city that isn't in `GET /v1/cities`: `422 unknown_city`. A category
        that isn't in `GET /v1/service-categories`: `422 unknown_category`.
      security: []
      parameters:
        - name: city
          in: query
          description: A city code from `GET /v1/cities`.
          schema:
            type: string
            pattern: "^[a-z][a-z_]{1,39}$"
            example: riyadh
        - name: q
          in: query
          description: A branch name, or part of one, in Arabic or English.
          schema:
            type: string
            minLength: 1
            maxLength: 60
            example: الأناقة
        - name: category
          in: query
          description: |
            Only branches offering a service of this kind: a code from
            `GET /v1/service-categories`.
          schema:
            type: string
            pattern: "^[a-z][a-z_]{1,39}$"
            example: beard
        - name: open_now
          in: query
          description: "`true`: only branches open at this moment. `false` or absent: open or not."
          schema:
            type: boolean
        - name: lat
          in: query
          description: Search near this latitude (with `lng`), e.g. the customer's location.
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
            example: 24.6911
        - name: lng
          in: query
          description: Search near this longitude (with `lat`).
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
            example: 46.6851
        - name: radius_km
          in: query
          description: How far from `lat`, `lng` to look, in kilometres; 10 if not given.
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: cursor
          in: query
          description: "`next_cursor` from the previous page."
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: A page of branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListingPage"
        default:
          $ref: "#/components/responses/Problem"

  /v1/branches/{branch_id}:
    parameters:
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: getBranchPage
      tags: [discovery]
      security: []
      summary: A branch's public page (public)
      description: |
        What a customer sees of a branch before booking: where it is, its
        weekly opening hours and whether it is open now, and its menu, the
        services they can choose, each from its cheapest barber's price.
        Pass a service's `id` to `GET /v1/branches/{branch_id}/availability`.

        Kept from the businesses' changes, like `GET /v1/branches`: a change
        shows here moments after it is made. Only a branch that search would
        show answers (published, and offering a service); anything else is
        `404`.
      responses:
        "200":
          description: The branch's page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchPage"
        default:
          $ref: "#/components/responses/Problem"

  /v1/branches/{branch_id}/availability:
    parameters:
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: getAvailability
      tags: [booking]
      security: []
      summary: When a branch can do some services on a day (public)
      description: |
        Start times on `date` (in the branch's time zone) at which a barber
        who performs *all* of `service_ids` — back to back, plus the
        branch's buffer — is working and not booked. Omit `barber_id` for
        any barber: each slot lists who is free then. The list is advisory:
        someone may book a slot first (booking answers
        `409 slot_unavailable`, then ask again).

        Only a published branch of an active business answers; anything
        else is `404`. A date before today or past the booking horizon has
        no slots. A service the branch doesn't offer:
        `422 service_unavailable`; a `barber_id` who doesn't perform them
        all: `422 barber_unavailable`.
      parameters:
        - name: date
          in: query
          required: true
          description: The day, in the branch's time zone.
          schema:
            type: string
            format: date
            example: "2026-10-04"
        - name: service_ids
          in: query
          required: true
          description: 1 to 5 different services, comma-separated.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: string
              format: uuid
        - name: barber_id
          in: query
          description: One barber (a staff ID); omit for any barber.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The barbers who could do it, and the free start times
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        default:
          $ref: "#/components/responses/Problem"

  /v1/appointments:
    post:
      operationId: bookAppointment
      tags: [booking]
      summary: Book an appointment (signed-in customer)
      description: |
        Books the customer in at `starts_at` for `service_ids`, performed
        back to back by one barber: `barber_id`, or any barber (then the
        free one with the fewest booked minutes that day). Take the time
        from `GET …/availability`; the rules are checked again here.

        - `Idempotency-Key` is required: a UUID the app makes per booking
          attempt and sends again on a retry. A retry gets the appointment
          the first request made (`201`, with `Idempotent-Replayed: true`);
          the same key with a different request is
          `422 idempotency_key_reused`. A failed request doesn't use up
          its key.
        - Someone booked the time first, or the barber's hours changed:
          `409 slot_unavailable` — ask for availability again.
        - Off the branch's grid, sooner than its lead time, or past its
          horizon: `422 invalid_start`.
        - Already holding the most upcoming bookings the branch allows:
          `409 booking_limit_reached`.

        The appointment is `confirmed`, or `pending` until the shop
        answers when the branch confirms bookings itself.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentRequest"
      responses:
        "201":
          description: The appointment (or the one this key already made)
          headers:
            Idempotent-Replayed:
              description: "`true` when this is a retry's answer."
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me/appointments/{appointment_id}:
    parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getMyAppointment
      tags: [booking]
      summary: One of my appointments
      description: Someone else's appointment is `404`, like one that doesn't exist.
      responses:
        "200":
          description: The appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/me/appointments/{appointment_id}/cancel:
    parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelMyAppointment
      tags: [booking]
      summary: Cancel one of my appointments
      description: |
        A pending booking can be cancelled until it starts. A confirmed one
        until its `cancellable_until`: the start minus the branch's
        cancellation window when it was booked (a later change to the
        window doesn't move it). After that: `409 cancellation_window_passed`.
        Already cancelled, completed, rejected or expired:
        `409 invalid_transition`. Someone else's appointment is `404`.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: The cancelled appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/appointments/{appointment_id}/{action}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [confirm, reject, cancel, complete, no-show]
    post:
      operationId: actOnAppointment
      tags: [booking]
      summary: Confirm, reject, cancel, complete or mark a no-show (the shop)
      description: |
        - `confirm` / `reject`: a pending booking (not past its `pending_until`).
        - `cancel`: a pending or confirmed one, at any time; the only action
          that takes a `reason`.
        - `complete` / `no-show`: a confirmed one, once it has started
          (before: `409 appointment_not_started`).

        Anything else is `409 invalid_transition`. A barber acts on their
        own appointments; the owner and managers on any at the branches
        they work at — others get `403`. Not staff of the business, or
        another business's appointment: `404`. Two staff acting at once take
        turns: the second sees what the first did.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: The appointment after the action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/appointments:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: listBranchAppointments
      tags: [booking]
      summary: A branch's appointments on a day (staff of the branch)
      description: |
        Every appointment starting on `date` (in the branch's time zone),
        in every status, by start time. A barber sees their own; the owner
        and the branch's managers see everyone's. Staff of another branch:
        `403`; not staff of the business, or not its branch: `404`.
      parameters:
        - name: date
          in: query
          required: true
          description: The day, in the branch's time zone.
          schema:
            type: string
            format: date
            example: "2026-10-04"
      responses:
        "200":
          description: The day's appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchDay"
        default:
          $ref: "#/components/responses/Problem"

    post:
      operationId: bookWalkIn
      tags: [booking]
      summary: Book a walk-in (staff of the branch)
      description: |
        The shop books someone without the app — a walk-in, or a customer
        who phoned — by name. The owner and the branch's managers book
        any barber there; a barber books themselves (others: `403`).

        Unlike the app: any whole minute, not only the slot grid; from 15
        minutes ago (they may be in the chair already), no lead time;
        still within the booking horizon (`422 invalid_start`). The barber
        must perform every service (`422 barber_unavailable`), be working
        then and be free (`409 slot_unavailable`). It is confirmed at once.
        A branch that isn't published, or whose business isn't active,
        takes no bookings: `409 branch_not_bookable`.

        `Idempotency-Key` works as for the app, per staff member.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalkInRequest"
      responses:
        "201":
          description: The appointment (or the one this key already made)
          headers:
            Idempotent-Replayed:
              description: "`true` when this is a retry's answer."
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        default:
          $ref: "#/components/responses/Problem"

  /v1/service-categories:
    get:
      operationId: listServiceCategories
      tags: [services]
      summary: Service categories (public)
      description: Platform reference data, in display order. Every service belongs to one.
      security: []
      responses:
        "200":
          description: The categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCategoryList"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/services:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: listServices
      tags: [services]
      summary: The branch's services (anyone working at the branch)
      description: |
        Inactive services included, so staff can turn them back on. Ordered by
        `sort_order`, then oldest first. A branch's menu is short, so the list
        is not paginated.
      responses:
        "200":
          description: The services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createService
      tags: [services]
      summary: Add a service (owner, or a manager of the branch)
      description: |
        Durations are 5–480 minutes in steps of 5. Prices are VAT-inclusive
        halalas (`{"amount": 6000, "currency": "SAR"}` is 60.00 SAR).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/services/{service_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
      - $ref: "#/components/parameters/ServiceID"
    patch:
      operationId: updateService
      tags: [services]
      summary: Edit or deactivate a service (owner, or a manager of the branch)
      description: |
        Send only the fields that change; `"active": false` takes it off the
        menu (services are never deleted: appointments point at them).
        `If-Match` carries the `version` you last read (`412 version_conflict`
        if it changed since).
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: The updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/services/{service_id}/offerings:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
      - $ref: "#/components/parameters/ServiceID"
    put:
      operationId: setServiceOfferings
      tags: [services]
      summary: Set who performs a service (owner, or a manager of the branch)
      description: |
        Replaces the whole list. Everyone listed must be active staff working
        at this branch (`422 validation_failed` otherwise) — owners and
        managers who also cut hair included. An offering may set its own
        `price` or `duration_minutes`; omitted, the service's apply. An empty
        list means nobody performs it (customers can't book it).

        Offerings are part of the service, so this takes the service's
        `If-Match` version and returns the service with a new one.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferingsUpdate"
      responses:
        "200":
          description: The service, with its offerings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/opening-hours:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
    get:
      operationId: getOpeningHours
      tags: [scheduling]
      summary: The branch's weekly opening hours (anyone working at the branch)
      description: |
        All seven days, Sunday first; a day with no intervals is closed. Times
        are the branch's local wall-clock time. A branch that never set its
        hours is closed all week, with `version` 0.
      responses:
        "200":
          description: The opening hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningHours"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setOpeningHours
      tags: [scheduling]
      summary: Set the weekly opening hours (owner, or a manager of the branch)
      description: |
        Replaces the whole week. Times are `HH:MM` on 5-minute steps, in the
        branch's local time. A `closes` at or before `opens` is on the next
        day: Thursday `16:00`–`02:00` is one ten-hour shift that belongs to
        Thursday. `00:00`–`00:00` (or `00:00`–`24:00`) is all day. At most
        4 intervals start on one day, and none may overlap — including a
        Saturday-night shift running into Sunday (`422 validation_failed`).

        `If-Match` carries the `version` you last read: `0` the first time.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningHoursUpdate"
      responses:
        "200":
          description: The saved opening hours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpeningHours"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/staff/{staff_id}/schedule:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
      - $ref: "#/components/parameters/StaffID"
    get:
      operationId: getBarberSchedule
      tags: [scheduling]
      summary: A staff member's schedule at a branch (anyone working at the branch)
      description: |
        The weekly template (all seven days, Sunday first) and the date
        overrides. A schedule never set is empty, with `version` 0. Someone
        who doesn't work at the branch gets `404 not_found`.
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSchedule"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: setBarberSchedule
      tags: [scheduling]
      summary: Set a staff member's schedule at a branch (the person, the owner or a manager of the branch)
      description: |
        Replaces the weekly template and every date override. Times follow
        the opening-hours rules (branch-local, 5-minute steps, a `closes` at
        or before `opens` is the next day). An override replaces the
        intervals that start on its date; with no intervals it is a day off.
        The template may not overlap the same person's template at another
        branch (`422 validation_failed`): nobody works in two shops at once.

        `If-Match` carries the `version` you last read: `0` the first time.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarberScheduleUpdate"
      responses:
        "200":
          description: The saved schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BarberSchedule"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/branches/{branch_id}/staff/{staff_id}/working-windows:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/BranchID"
      - $ref: "#/components/parameters/StaffID"
    get:
      operationId: getWorkingWindows
      tags: [scheduling]
      summary: When a staff member can work at a branch (anyone working at the branch)
      description: |
        The branch's opening hours ∩ the person's schedule (overrides
        included), minus their time off — as real instants within
        [`from`, `to`), sorted and merged. A shift that started the night
        before `from` is included from `from`. This is the calculation
        booking uses before offering slots. At most 62 days per query.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-10-01T00:00:00+03:00"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          example: "2026-10-08T00:00:00+03:00"
      responses:
        "200":
          description: The windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkingWindows"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/staff/{staff_id}/time-off:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/StaffID"
    get:
      operationId: listTimeOff
      tags: [scheduling]
      summary: A staff member's upcoming time off (the person, the owner or a manager of one of their branches)
      description: Time off that hasn't ended yet, earliest first.
      responses:
        "200":
          description: The time off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeOffList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: addTimeOff
      tags: [scheduling]
      summary: Record time off (the person, the owner or a manager of one of their branches)
      description: |
        Real instants, at every branch the person works at. At most a year
        long. Overlapping existing time off gets `409 time_off_overlaps`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeOffCreate"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeOff"
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/staff/{staff_id}/time-off/{time_off_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
      - $ref: "#/components/parameters/StaffID"
      - $ref: "#/components/parameters/TimeOffID"
    delete:
      operationId: deleteTimeOff
      tags: [scheduling]
      summary: Remove time off (the person, the owner or a manager of one of their branches)
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/verification/documents:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: listVerificationDocuments
      tags: [businesses]
      summary: The business's verification documents (owner)
      description: |
        Each document comes with a signed `download_url` that works for a few
        minutes. Ask again for fresh links; never store them.
      responses:
        "200":
          description: The documents, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocumentList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: uploadVerificationDocument
      tags: [businesses]
      summary: Upload a verification document, e.g. the CR certificate (owner)
      description: |
        Send the file itself as the body (`Content-Type: application/octet-stream`),
        up to 10 MiB. PDF, JPEG and PNG are accepted; the type is read from the
        file's content, not its name (`415 unsupported_media_type` otherwise,
        `413 payload_too_large` when bigger).

        Only while the business is `draft` or `rejected`
        (`409 invalid_state_transition`), and at most 5 documents
        (`409 document_limit_reached`).
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [cr_certificate]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocument"
        default:
          $ref: "#/components/responses/Problem"

  /v1/media/{media_id}:
    parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: downloadMedia
      tags: [media]
      security: []
      summary: Download a file through a signed link
      description: |
        Public, because the link itself is the permission: `expires` and
        `signature` are issued by the API (`download_url`) and stop working
        after a few minutes. A changed, expired or made-up link gets
        `403 download_link_invalid`. Files are always sent as attachments.
      parameters:
        - name: expires
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: signature
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        "200":
          description: The file
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"

  /v1/businesses/{business_id}/verification/submit:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    post:
      operationId: submitBusiness
      tags: [businesses]
      summary: Send the business for review (owner)
      description: |
        Moves a `draft` or `rejected` business to `pending_review`. It needs a
        CR document (`409 cr_document_required`) and at least one branch
        (`409 branch_required`). Submitting claims the CR number: if another
        submitted or approved business uses it, `409 cr_number_taken`.
        While under review the business can't be edited.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        default:
          $ref: "#/components/responses/Problem"

  /v1/admin/businesses:
    get:
      operationId: listBusinessesForReview
      tags: [admin]
      summary: The review queue (platform admins)
      description: |
        Businesses in one status, oldest submission first. Pass `next_cursor`
        from a page as `cursor` to get the next one. Drafts are never listed:
        they belong to their owner until submitted. Non-admins get `403 forbidden`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending_review, active, rejected, suspended]
            default: pending_review
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessPage"
        default:
          $ref: "#/components/responses/Problem"

  /v1/admin/businesses/{business_id}:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    get:
      operationId: getBusinessForReview
      tags: [admin]
      summary: A submitted business with its documents and branches (platform admins)
      description: Document links are signed and work for a few minutes. Drafts get `404 not_found`.
      responses:
        "200":
          description: The business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusinessDetail"
        default:
          $ref: "#/components/responses/Problem"

  /v1/admin/businesses/{business_id}/approve:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    post:
      operationId: approveBusiness
      tags: [admin]
      summary: Approve a business under review (platform admins)
      description: |
        `pending_review` → `active`. Anything else: `409 invalid_state_transition`.
        An admin who owns, works at or used to work at the business can't
        decide on it (`403 forbidden`).
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        default:
          $ref: "#/components/responses/Problem"

  /v1/admin/businesses/{business_id}/reject:
    parameters:
      - $ref: "#/components/parameters/BusinessID"
    post:
      operationId: rejectBusiness
      tags: [admin]
      summary: Reject a business under review, with a reason (platform admins)
      description: |
        `pending_review` → `rejected`. The owner sees `rejection_reason`, fixes
        the business and submits again. Rejecting releases the CR number claim.
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Rejection"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBusiness"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `tokens.access_token` (sign-in or refresh).

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred language (`ar` default, `en`). Also the language saved for new users.
      schema:
        type: string
        example: ar-SA

    BusinessID:
      name: business_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    BranchID:
      name: branch_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    ServiceID:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    StaffID:
      name: staff_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    TimeOffID:
      name: time_off_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: The `version` you last read, e.g. `3` or `"3"`.
      schema:
        type: string
        minLength: 1
        maxLength: 20
        example: '"3"'

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      headers:
        Retry-After:
          description: Seconds to wait before retrying (only on 429)
          schema:
            type: integer
        WWW-Authenticate:
          description: 'Bearer challenge (only on 401 from protected operations)'
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Too Many Requests
        status:
          type: integer
          example: 429
        code:
          type: string
          description: |
            Stable machine-readable error code. Known values:
            `validation_failed`, `not_found`, `method_not_allowed`, `internal`,
            `not_ready`, `rate_limited`, `otp_cooldown`, `otp_invalid`,
            `otp_expired`, `otp_too_many_attempts`, `otp_locked`, `user_blocked`,
            `unauthorized`, `refresh_token_invalid`, `refresh_token_reused`,
            `forbidden`, `business_already_registered`, `invalid_state_transition`,
            `version_conflict`, `unsupported_media_type`, `payload_too_large`,
            `document_limit_reached`, `download_link_invalid`, `cr_document_required`,
            `branch_required`, `cr_number_taken`, `invitation_invalid`,
            `invitation_closed`, `already_staff`, `plan_limit_reached`, `time_off_overlaps`,
            `registration_limit_reached`, `branch_not_ready`, `business_not_active`,
            `service_unavailable`, `barber_unavailable`, `slot_unavailable`, `invalid_start`,
            `booking_limit_reached`, `idempotency_key_reused`, `invalid_transition`,
            `cancellation_window_passed`, `appointment_not_started`, `branch_not_bookable`.
          example: otp_cooldown
        detail:
          type: string
        request_id:
          type: string

    OTPRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 64
          description: Saudi mobile number in any common format (05…, +9665…, Arabic-Indic digits).
          example: "0551234567"

    OTPRequested:
      type: object
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds:
          type: integer
          example: 300
        resend_after_seconds:
          type: integer
          example: 60

    OTPVerify:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 64
          example: "0551234567"
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: The 6-digit code (Western or Arabic-Indic digits).
          example: "482193"

    Login:
      type: object
      required: [user, is_new_user, tokens]
      properties:
        user:
          $ref: "#/components/schemas/User"
        is_new_user:
          type: boolean
          description: True when this verification created the account (show onboarding).
        tokens:
          $ref: "#/components/schemas/TokenPair"

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, refresh_expires_in]
      properties:
        access_token:
          type: string
          description: 'Send as `Authorization: Bearer <access_token>`.'
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires.
          example: 900
        refresh_token:
          type: string
          description: Single use. Store it in the device's secure storage only.
        refresh_expires_in:
          type: integer
          description: Seconds until the refresh token expires if unused.
          example: 2592000

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 256

    User:
      type: object
      required: [id, phone, locale, created_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+966551234567"
        name:
          type: string
          nullable: true
          example: عبدالرحمن
        locale:
          type: string
          enum: [ar, en]
        created_at:
          type: string
          format: date-time

    LocalizedText:
      type: object
      additionalProperties: false
      required: [ar]
      description: Text in Arabic (required) and English (optional).
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 100
          example: صالون الأناقة
        en:
          type: string
          maxLength: 100
          example: Elegance Barbers

    BusinessRegistration:
      type: object
      additionalProperties: false
      required: [display_name, legal_name, cr_number]
      properties:
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
          description: The name on the Commercial Registration.
          example: مؤسسة الأناقة للحلاقة
        cr_number:
          type: string
          minLength: 10
          maxLength: 20
          description: 10-digit Commercial Registration number (Western or Arabic-Indic digits; spaces allowed).
          example: "1010123456"

    BusinessUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; at least one.
      properties:
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
          minLength: 1
          maxLength: 200

    BusinessStatus:
      type: string
      enum: [draft, pending_review, active, rejected, suspended]
      description: |
        `draft` → `pending_review` (submitted) → `active` (approved) or
        `rejected` (fix and resubmit); `active` ↔ `suspended` by the platform.

    StaffRole:
      type: string
      enum: [owner, manager, barber]

    Business:
      type: object
      required: [id, display_name, legal_name, cr_number, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        legal_name:
          type: string
        cr_number:
          type: string
          example: "1010123456"
        status:
          $ref: "#/components/schemas/BusinessStatus"
        version:
          type: integer
          description: Increases on every change; send it as `If-Match` when editing.
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: When the business was last sent for review.
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
          description: Why the last review rejected it (only while `rejected`).

    BusinessSummary:
      type: object
      required: [id, display_name, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          $ref: "#/components/schemas/LocalizedText"
        status:
          $ref: "#/components/schemas/BusinessStatus"

    Membership:
      type: object
      required: [business, staff_id, role]
      properties:
        business:
          $ref: "#/components/schemas/BusinessSummary"
        staff_id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/StaffRole"

    MembershipList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Membership"

    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 24.6911
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 46.6851

    BookingPolicy:
      type: object
      additionalProperties: false
      description: How a branch takes bookings. Defaults are shown as examples.
      required: [min_lead_minutes, horizon_days, slot_interval_minutes, buffer_minutes, cancellation_window_minutes, auto_confirm, pending_expiry_minutes, max_active_bookings]
      properties:
        min_lead_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: Earliest booking is now + this.
          example: 30
        horizon_days:
          type: integer
          minimum: 1
          maximum: 180
          description: Latest booking is today + this.
          example: 30
        slot_interval_minutes:
          type: integer
          enum: [5, 10, 15, 20, 30, 60]
          description: Start times are offered every this many minutes.
          example: 15
        buffer_minutes:
          type: integer
          minimum: 0
          maximum: 60
          description: Cleanup time after each appointment.
          example: 0
        cancellation_window_minutes:
          type: integer
          minimum: 0
          maximum: 2880
          description: Customers may cancel until this long before the start.
          example: 120
        auto_confirm:
          type: boolean
          description: False means the shop confirms each booking.
          example: true
        pending_expiry_minutes:
          type: integer
          minimum: 5
          maximum: 120
          description: An unconfirmed booking expires after this (only when auto_confirm is false).
          example: 15
        max_active_bookings:
          type: integer
          minimum: 1
          maximum: 10
          description: Future bookings one customer may hold at this branch.
          example: 2

    BranchCreate:
      type: object
      additionalProperties: false
      required: [name, city_code, address, location]
      properties:
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          pattern: "^[a-z][a-z_]{1,39}$"
          description: A city from the app's list, e.g. `riyadh`, `jeddah`, `al_khobar`.
          example: riyadh
        district:
          type: string
          maxLength: 80
          example: العليا
        address:
          type: string
          minLength: 1
          maxLength: 200
          example: شارع العليا العام
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          maxLength: 64
          description: Saudi mobile number in any common format.
          example: "0551234567"
        timezone:
          type: string
          maxLength: 64
          description: IANA time zone of the branch (default `Asia/Riyadh`).
          example: Asia/Riyadh
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"

    BranchUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; at least one.
      properties:
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          pattern: "^[a-z][a-z_]{1,39}$"
        district:
          type: string
          maxLength: 80
          description: Empty clears it.
        address:
          type: string
          minLength: 1
          maxLength: 200
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          maxLength: 64
          description: Empty clears it.
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"

    BranchStatus:
      type: string
      enum: [draft, published, unpublished]

    Branch:
      type: object
      required: [id, business_id, name, city_code, address, location, timezone, booking_policy, status, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        city_code:
          type: string
          example: riyadh
        district:
          type: string
          nullable: true
        address:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          nullable: true
          example: "+966551234567"
        timezone:
          type: string
          example: Asia/Riyadh
        booking_policy:
          $ref: "#/components/schemas/BookingPolicy"
        status:
          $ref: "#/components/schemas/BranchStatus"
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BranchList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Branch"

    VerificationDocument:
      type: object
      required: [id, kind, content_type, size_bytes, uploaded_at, download_url, download_url_expires_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [cr_certificate]
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        size_bytes:
          type: integer
          format: int64
        uploaded_at:
          type: string
          format: date-time
        download_url:
          type: string
          description: Relative, signed link (prefix it with the API's base URL). Works until download_url_expires_at.
          example: /v1/media/01a0e410-90f4-75da-8156-6b695634873a?expires=1790000000&signature=abc
        download_url_expires_at:
          type: string
          format: date-time

    VerificationDocumentList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDocument"

    Rejection:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: صورة السجل التجاري غير واضحة، يرجى رفع نسخة أوضح

    AdminBusiness:
      type: object
      required: [business, owner_user_id]
      properties:
        business:
          $ref: "#/components/schemas/Business"
        owner_user_id:
          type: string
          format: uuid
        reviewed_by:
          type: string
          format: uuid
          nullable: true

    AdminBusinessPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdminBusiness"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; absent on the last page.

    AdminBusinessDetail:
      type: object
      required: [business, documents, branches]
      properties:
        business:
          $ref: "#/components/schemas/AdminBusiness"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/VerificationDocument"
        branches:
          type: array
          items:
            $ref: "#/components/schemas/Branch"

    StaffInvitationCreate:
      type: object
      additionalProperties: false
      required: [phone, display_name, role, branch_ids]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 64
          description: Saudi mobile number in any common format.
          example: "0551234567"
        display_name:
          type: string
          minLength: 1
          maxLength: 80
          description: How customers and colleagues will see them.
          example: أحمد
        role:
          type: string
          enum: [manager, barber]
          description: A business has one owner, from registration; it can't be invited.
        branch_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: The branches they will work at (managers run these branches).
          items:
            type: string
            format: uuid

    StaffInvitation:
      type: object
      required: [id, phone, display_name, role, branch_ids, status, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+966551234567"
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
        status:
          type: string
          enum: [pending, accepted, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    StaffInvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffInvitation"

    InvitationAccept:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
          description: The `token` from the invitation link.

    StaffMember:
      type: object
      required: [id, display_name, role, branch_ids, active, joined_at]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Empty for the owner until profiles exist.
        role:
          $ref: "#/components/schemas/StaffRole"
        branch_ids:
          type: array
          description: Where they work. Empty for the owner, who runs every branch.
          items:
            type: string
            format: uuid
        active:
          type: boolean
        joined_at:
          type: string
          format: date-time

    StaffMemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StaffMember"

    Plan:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          enum: [free, pro]
        name:
          $ref: "#/components/schemas/LocalizedText"

    Subscription:
      type: object
      required: [plan, status, max_branches, max_staff]
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
        status:
          type: string
          enum: [setup, trialing, free]
          description: |
            `setup` — not approved yet (Pro limits while setting up);
            `trialing` — the 30-day Pro trial; `free` — the trial ended.
        trial_ends_at:
          type: string
          format: date-time
          nullable: true
          description: When the trial ends or ended; absent before approval.
        max_branches:
          type: integer
          example: 5
        max_staff:
          type: integer
          description: Managers and barbers, including pending invitations. The owner is free.
          example: 30

    Availability:
      type: object
      required: [branch_id, date, time_zone, barbers, slots]
      properties:
        branch_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        time_zone:
          type: string
          description: The branch's IANA time zone, e.g. Asia/Riyadh.
          example: Asia/Riyadh
        barbers:
          type: array
          description: Every barber who performs all the services, with their total.
          items:
            $ref: "#/components/schemas/BarberOffer"
        slots:
          type: array
          description: Free start times, in order.
          items:
            $ref: "#/components/schemas/Slot"

    AppointmentRequest:
      type: object
      additionalProperties: false
      required: [branch_id, starts_at, service_ids]
      properties:
        branch_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: A start time from availability.
        service_ids:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uuid
        barber_id:
          type: string
          format: uuid
          description: Omit for any barber.
        note:
          type: string
          maxLength: 300
          description: For the barber, e.g. "short on the sides".

    Appointment:
      type: object
      required: [id, branch_id, barber, status, source, assignment, starts_at, ends_at, cancellable_until, items, price, note, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
          description: Who booked it in the app (a user ID); absent for a walk-in.
        customer_name:
          type: string
          description: A walk-in's name, as the shop gave it; absent for app bookings.
        barber:
          $ref: "#/components/schemas/AppointmentBarber"
        status:
          type: string
          enum: [pending, confirmed, rejected, expired, cancelled, completed, no_show]
        source:
          type: string
          enum: [customer_app, staff]
        assignment:
          type: string
          enum: [requested_barber, any_barber]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: When the services end.
        pending_until:
          type: string
          format: date-time
          description: A pending booking expires then, unless the shop confirms it.
        cancellable_until:
          type: string
          format: date-time
          description: |
            Until when the customer may cancel once it is confirmed: the
            start minus the branch's cancellation window when it was booked.
        cancellation:
          $ref: "#/components/schemas/Cancellation"
        items:
          type: array
          description: What was booked, at the price and length of the time of booking.
          items:
            $ref: "#/components/schemas/AppointmentItem"
        price:
          $ref: "#/components/schemas/Money"
        note:
          type: string
        created_at:
          type: string
          format: date-time
        version:
          type: integer

    Cancellation:
      type: object
      description: Present once the appointment was cancelled.
      required: [by, reason, at]
      properties:
        by:
          type: string
          enum: [customer, staff]
        reason:
          type: string
          description: Empty if none was given.
        at:
          type: string
          format: date-time

    WalkInRequest:
      type: object
      additionalProperties: false
      required: [starts_at, service_ids, barber_id, customer_name]
      properties:
        starts_at:
          type: string
          format: date-time
          description: A whole minute.
        service_ids:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: uuid
        barber_id:
          type: string
          format: uuid
        customer_name:
          type: string
          minLength: 1
          maxLength: 100
        note:
          type: string
          maxLength: 300

    CancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 300
          description: Why, for the other side (optional; cancel only).

    BranchDay:
      type: object
      required: [branch_id, date, time_zone, appointments]
      properties:
        branch_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        time_zone:
          type: string
          example: Asia/Riyadh
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"

    AppointmentBarber:
      type: object
      required: [id, display_name]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string

    AppointmentItem:
      type: object
      required: [service_id, name, duration_minutes, price]
      properties:
        service_id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        duration_minutes:
          type: integer
        price:
          $ref: "#/components/schemas/Money"

    BarberOffer:
      type: object
      required: [id, display_name, duration_minutes, price]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        duration_minutes:
          type: integer
          description: The services together, without the branch's buffer.
          example: 45
        price:
          $ref: "#/components/schemas/Money"

    Slot:
      type: object
      required: [starts_at, barber_ids]
      properties:
        starts_at:
          type: string
          format: date-time
          description: UTC.
        barber_ids:
          type: array
          description: Who is free to start then.
          items:
            type: string
            format: uuid

    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: In the currency's minor unit (halalas for SAR).
          example: 6000
        currency:
          type: string
          enum: [SAR]

    ServiceCategory:
      type: object
      required: [code, name, icon]
      properties:
        code:
          type: string
          example: haircut
        name:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
          example: scissors

    ServiceCategoryList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ServiceCategory"

    City:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: riyadh
        name:
          $ref: "#/components/schemas/LocalizedText"

    CityList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/City"

    BranchListing:
      type: object
      description: A branch as customers find it.
      required: [id, name, city, district, address, location, price_from, open_now]
      properties:
        id:
          type: string
          format: uuid
          description: The branch ID (`GET /v1/branches/{branch_id}/availability`, booking).
        name:
          $ref: "#/components/schemas/LocalizedText"
        city:
          $ref: "#/components/schemas/City"
        district:
          type: string
          example: العليا
        address:
          type: string
          example: شارع العليا العام
        location:
          $ref: "#/components/schemas/GeoPoint"
        distance_m:
          type: integer
          description: Metres from the place searched near (straight line); only when searching near a place.
          example: 850
        price_from:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: |
            The least a customer pays for a service here (for one of
            `category`'s, if the search gave one): the cheapest barber's
            price.
        open_now:
          type: boolean
          description: |
            Open at this moment, by its weekly opening hours in its own time
            zone (holidays aren't known yet).

    BranchPage:
      type: object
      description: A branch's public page.
      required: [id, name, city, district, address, location, timezone, price_from, open_now, opening_hours, services]
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: "#/components/schemas/LocalizedText"
        city:
          $ref: "#/components/schemas/City"
        district:
          type: string
          example: العليا
        address:
          type: string
          example: شارع العليا العام
        location:
          $ref: "#/components/schemas/GeoPoint"
        phone:
          type: string
          description: The shop's public number (E.164); absent if it has none.
          example: "+966551234567"
        timezone:
          type: string
          description: The branch's IANA time zone; `opening_hours` are in it.
          example: Asia/Riyadh
        price_from:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The least a customer pays for a service here.
        open_now:
          type: boolean
          description: Open at this moment, by its weekly opening hours (holidays aren't known yet).
        opening_hours:
          type: array
          description: |
            All seven days, Sunday first, in the branch's time zone. A
            `closes` at or before `opens` is the next day.
          items:
            $ref: "#/components/schemas/DayHours"
        services:
          type: array
          description: The services customers can choose here, in the shop's order.
          items:
            $ref: "#/components/schemas/BranchService"

    BranchService:
      type: object
      description: A service on a branch's menu.
      required: [id, category, name, duration_minutes, price_from]
      properties:
        id:
          type: string
          format: uuid
          description: Pass as one of `service_ids` to the branch's availability.
        category:
          type: string
          description: A code from `GET /v1/service-categories`.
          example: beard
        name:
          $ref: "#/components/schemas/LocalizedText"
        duration_minutes:
          type: integer
          description: The service's own length; a barber's may differ (availability says).
          example: 30
        price_from:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: The least a customer pays for it, the cheapest barber's price.

    BranchListingPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BranchListing"
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` for the next page; absent on the last page.

    ServiceDescription:
      type: object
      additionalProperties: false
      description: Optional, in either language; an empty string means none.
      properties:
        ar:
          type: string
          maxLength: 500
        en:
          type: string
          maxLength: 500

    ServiceCreate:
      type: object
      additionalProperties: false
      required: [category, name, duration_minutes, price]
      properties:
        category:
          type: string
          description: A code from `GET /v1/service-categories`.
          example: haircut
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/ServiceDescription"
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
          multipleOf: 5
          example: 30
        price:
          $ref: "#/components/schemas/Money"
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000
          description: Lower first. Default 0.

    ServiceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        category:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/ServiceDescription"
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
          multipleOf: 5
        price:
          $ref: "#/components/schemas/Money"
        sort_order:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean

    Offering:
      type: object
      additionalProperties: false
      required: [staff_id]
      properties:
        staff_id:
          type: string
          format: uuid
          description: A staff member's `id` from `GET /v1/businesses/{business_id}/staff`.
        price:
          $ref: "#/components/schemas/Money"
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 480
          multipleOf: 5

    OfferingsUpdate:
      type: object
      additionalProperties: false
      required: [offerings]
      properties:
        offerings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/Offering"

    Service:
      type: object
      required: [id, branch_id, category, name, duration_minutes, price, offerings, active, sort_order, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        category:
          type: string
          example: haircut
        name:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/ServiceDescription"
        duration_minutes:
          type: integer
          example: 30
        price:
          $ref: "#/components/schemas/Money"
        offerings:
          type: array
          description: Who performs it, with their own price or duration when set.
          items:
            $ref: "#/components/schemas/Offering"
        active:
          type: boolean
        sort_order:
          type: integer
        version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Service"

    Weekday:
      type: string
      enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]

    TimeRange:
      type: object
      additionalProperties: false
      required: [opens, closes]
      properties:
        opens:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][05]$'
          example: "16:00"
        closes:
          type: string
          pattern: '^(([01][0-9]|2[0-3]):[0-5][05]|24:00)$'
          description: At or before `opens` means the next day.
          example: "02:00"

    DayHours:
      type: object
      additionalProperties: false
      required: [weekday, intervals]
      properties:
        weekday:
          $ref: "#/components/schemas/Weekday"
        intervals:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/TimeRange"

    OpeningHoursUpdate:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          maxItems: 7
          description: Days left out are closed.
          items:
            $ref: "#/components/schemas/DayHours"

    OpeningHours:
      type: object
      required: [days, version]
      properties:
        days:
          type: array
          description: All seven days, Sunday first.
          items:
            $ref: "#/components/schemas/DayHours"
        version:
          type: integer
          description: 0 until the hours are first set; send it as `If-Match`.
        updated_at:
          type: string
          format: date-time
          nullable: true

    DateHours:
      type: object
      additionalProperties: false
      required: [date, intervals]
      properties:
        date:
          type: string
          format: date
          example: "2026-10-08"
        intervals:
          type: array
          maxItems: 4
          description: Empty for a day off.
          items:
            $ref: "#/components/schemas/TimeRange"

    BarberScheduleUpdate:
      type: object
      additionalProperties: false
      required: [weekly]
      properties:
        weekly:
          type: array
          maxItems: 7
          description: Days left out are days off.
          items:
            $ref: "#/components/schemas/DayHours"
        overrides:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/DateHours"

    BarberSchedule:
      type: object
      required: [staff_id, branch_id, weekly, overrides, version]
      properties:
        staff_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        weekly:
          type: array
          description: All seven days, Sunday first.
          items:
            $ref: "#/components/schemas/DayHours"
        overrides:
          type: array
          description: By date.
          items:
            $ref: "#/components/schemas/DateHours"
        version:
          type: integer
          description: 0 until first set; send it as `If-Match`.
        updated_at:
          type: string
          format: date-time
          nullable: true

    TimeOffCreate:
      type: object
      additionalProperties: false
      required: [starts_at, ends_at]
      properties:
        starts_at:
          type: string
          format: date-time
          example: "2026-10-05T10:00:00+03:00"
        ends_at:
          type: string
          format: date-time
          example: "2026-10-05T12:00:00+03:00"
        reason:
          type: string
          maxLength: 200

    TimeOff:
      type: object
      required: [id, staff_id, starts_at, ends_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        staff_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    TimeOffList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TimeOff"

    TimeWindow:
      type: object
      required: [starts_at, ends_at]
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    WorkingWindows:
      type: object
      required: [staff_id, time_zone, data]
      properties:
        staff_id:
          type: string
          format: uuid
        time_zone:
          type: string
          description: The branch's time zone, for showing the windows in local time.
          example: Asia/Riyadh
        data:
          type: array
          items:
            $ref: "#/components/schemas/TimeWindow"
