# Local infrastructure for development. `make db-up` starts it; the Go app
# itself runs on your machine (`make dev`) so edits reload instantly.
#
# postgis/postgis publishes amd64 images only: on Apple Silicon, Docker
# Desktop runs it under emulation (slower to start, works fine).
name: barbershop

services:
  db:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_USER: barbershop
      POSTGRES_PASSWORD: barbershop # local development only
      POSTGRES_DB: barbershop
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      - db-data:/var/lib/postgresql # Postgres 18+ mounts the parent directory
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop -d barbershop"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Run a built or released image instead of `make dev` (profile "app"):
  #   make docker-build && make app-up BARBERSHOP_IMAGE=barbershop-backend:local
  #   make app-up BARBERSHOP_IMAGE=ghcr.io/abdulkhaliq-84/barbershop-backend:v0.1.0
  migrate:
    profiles: [app]
    image: ${BARBERSHOP_IMAGE:-ghcr.io/abdulkhaliq-84/barbershop-backend:latest}
    command: ["migrate"]
    environment: &app-env
      DATABASE_URL: postgres://barbershop:barbershop@db:5432/barbershop?sslmode=disable
      # Local development only: codes are printed to the log (docker compose logs api).
      OTP_SECRET: local-development-otp-secret-not-for-real-use
      SMS_PROVIDER: console
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    image: ${BARBERSHOP_IMAGE:-ghcr.io/abdulkhaliq-84/barbershop-backend:latest}
    command: ["api"]
    environment: *app-env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
