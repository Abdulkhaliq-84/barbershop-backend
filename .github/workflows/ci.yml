# CI: every pull request and every push to main must pass these checks.
# Stages run as parallel jobs; each one fails fast on its own.
# Pipeline lifecycle: docs/operations/ci-cd.md · Decision: docs/adr/0011-ci-cd-github-actions.md
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A new push to the same PR cancels the run that's now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved; a SHA can't).
      # Dependabot keeps these up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: golangci-lint (style, bugs, security, architecture boundaries)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  # Generated code (internal/apigen, */sqlcgen) is committed so the repo builds
  # with plain `go build`. This job fails when it no longer matches its sources
  # (api/openapi.yaml, migrations, queries.sql) — someone forgot `make generate`.
  generated:
    name: Generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regenerate (oapi-codegen, sqlc)
        run: make generate
      - name: Generated code matches its sources
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is out of date: run 'make generate' and commit the result."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A throwaway PostGIS for this job only — the same image as compose.yaml.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: barbershop
          POSTGRES_PASSWORD: barbershop
          POSTGRES_DB: barbershop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbershop -d barbershop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://barbershop:barbershop@localhost:5432/barbershop_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test (race detector, with database)
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build (static binary)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/server ./cmd/server
      # Build the production image too (not pushed), so a broken Dockerfile or a
      # vulnerable base image fails the PR instead of the delivery on main.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: barbershop-backend:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barbershop-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
