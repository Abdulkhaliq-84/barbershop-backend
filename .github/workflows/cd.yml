# CD: every push to main delivers a versioned, scanned, attested image to GHCR.
#
#   read-only scans ──► image (push :sha-… → attest) ──► promote published release
#
# - release-please keeps a "Release PR" open (version bump + CHANGELOG.md).
#   Merging that PR tags vX.Y.Z and creates a GitHub Release.
# - promote re-tags the image built for that exact commit (by digest) as
#   :vX.Y.Z, :X.Y and :latest — promotion never rebuilds.
# - The deploy stage (staging → production) is added when hosting is chosen.
#
# Pipeline lifecycle: docs/operations/ci-cd.md · Decision: docs/adr/0011-ci-cd-github-actions.md
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Deliveries run one at a time and are never cancelled half-way.
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abdulkhaliq-84/barbershop-backend # registry names must be lowercase

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create tags and GitHub Releases, update the release branch
      pull-requests: write # open and update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  scan:
    name: Image security
    uses: ./.github/workflows/image-scan.yml
    permissions:
      contents: read

  image:
    name: Publish and attest image
    needs: [release-please, scan]
    # A bot configuration failure must not block delivery; a scan failure must.
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.digest.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse the immutable commit image on retries
        id: existing
        run: |
          digest=$(bash scripts/ci/image-digest.sh "$IMAGE:sha-$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Build and push once (both architectures)
        id: push
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION=sha-${{ github.sha }}
          # Never import caches written by scanner or PR jobs.
          sbom: true
          provenance: mode=max
      - name: Select the published digest
        id: digest
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.push.outputs.digest }}
        run: |
          digest="${EXISTING:-$BUILT}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (also completes interrupted deliveries)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true
      - name: Update main channel only for current main
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:main" "$IMAGE@$DIGEST"
          fi

  promote:
    name: Promote release image
    needs: [release-please, image]
    # Inspect published releases on retries too: release_created may be empty
    # after the first attempt created the GitHub release but delivery failed.
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Find a published release for this exact commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: bash scripts/ci/release-tag.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.release.outputs.tag != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.release.outputs.tag != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote by digest, rejecting tag conflicts
        if: steps.release.outputs.tag != ''
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ steps.release.outputs.tag }}
        run: bash scripts/ci/promote.sh
