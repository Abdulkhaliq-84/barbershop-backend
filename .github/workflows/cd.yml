# CD: every push to main delivers a versioned, scanned, attested image to GHCR.
#
#   release-please ──► image (build once → scan → push :sha-… → attest) ──► promote (only on a release)
#
# - release-please keeps a "Release PR" open (version bump + CHANGELOG.md).
#   Merging that PR tags vX.Y.Z and creates a GitHub Release.
# - promote re-tags the image built for that exact commit (by digest) as
#   :vX.Y.Z, :X.Y and :latest — build once, promote; nothing is rebuilt.
# - The deploy stage (staging → production) is added when hosting is chosen.
#
# Pipeline lifecycle: docs/operations/ci-cd.md · Decision: docs/adr/0011-ci-cd-github-actions.md
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Deliveries run one at a time and are never cancelled half-way.
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/abdulkhaliq-84/barbershop-backend # registry names must be lowercase

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # create tags and GitHub Releases, update the release branch
      pull-requests: write # open and update the Release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Build, scan and publish image
    needs: release-please
    # Publish the image even if the release bot fails (e.g. a repository
    # setting is missing): a release problem must not block delivery.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
      id-token: write # keyless signing of the provenance (Sigstore via OIDC)
      attestations: write # store the attestation on GitHub
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version stamped into the binary
        id: version
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "value=${RELEASE_TAG:-sha-${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=main

      # 1) Build for amd64 and scan it BEFORE anything is published.
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: barbershop-backend:scan
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: barbershop-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 2) Build both architectures (cache makes amd64 instant) and push.
      #    BuildKit attaches an SBOM and max-mode provenance to the image.
      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      # 3) GitHub artifact attestation: verify with
      #    gh attestation verify oci://ghcr.io/abdulkhaliq-84/barbershop-backend:<tag> -R Abdulkhaliq-84/barbershop-backend
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  promote:
    name: Promote release image
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the tested image (no rebuild)
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:$MAJOR.$MINOR" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"
          echo "Promoted $IMAGE@$DIGEST → $TAG, $MAJOR.$MINOR, latest" | tee -a "$GITHUB_STEP_SUMMARY"
