# golangci-lint v2 — https://golangci-lint.run
# Run locally with `make lint` (and `make fmt` to auto-format). CI runs the same version.
version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # HTTP response bodies are closed
    - depguard      # architecture boundaries (see rules below)
    - errname       # error types end in Error, sentinels start with Err
    - errorlint     # use errors.Is/As with wrapped errors
    - gocritic      # common bug patterns and simplifications
    - gosec         # security issues (timeouts, crypto, injections)
    - misspell
    - nilerr        # returning nil when an error was checked
    - noctx         # I/O without a context
    - revive        # idiomatic Go style
    - unconvert
    - usestdlibvars # http.MethodGet instead of "GET", etc.
  settings:
    depguard:
      rules:
        # docs/architecture/overview.md §1: the domain layer is pure Go.
        domain-is-pure:
          files:
            - "**/internal/*/domain/**"
          deny:
            - pkg: net/http
              desc: the domain must not know about HTTP (map errors in adapters/httpapi)
            - pkg: database/sql
              desc: the domain must not know about the database (use a repository interface)
            - pkg: github.com/jackc/pgx
              desc: the domain must not know about the database (use a repository interface)
            - pkg: github.com/go-chi
              desc: the domain must not know about HTTP routing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/apigen
              desc: API types are an adapter concern (convert them in adapters/httpapi)
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/platform
              desc: the domain may import only the standard library and internal/shared
        # The application layer (use cases) talks to the outside only through
        # ports (interfaces in app/ports.go and domain repositories).
        app-uses-ports:
          files:
            - "**/internal/*/app/**"
          deny:
            - pkg: net/http
              desc: use cases must not know about HTTP (the httpapi adapter calls them)
            - pkg: database/sql
              desc: use cases must not know about the database (use a repository port)
            - pkg: github.com/jackc/pgx
              desc: use cases must not know about the database (use a repository port)
            - pkg: github.com/go-chi
              desc: use cases must not know about HTTP routing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/apigen
              desc: use cases take their own command structs, not generated API types
        # The shared kernel stays tiny and dependency-free (internal/shared/doc.go).
        shared-kernel-is-stable:
          files:
            - "**/internal/shared/**"
          allow:
            - $gostd
            - github.com/google/uuid
            - github.com/Abdulkhaliq-84/barbershop-backend/internal/shared
        # Modules meet only through each other's root package (module.go):
        # never another module's domain, app or adapters (overview.md §3).
        iam-keeps-to-itself:
          files:
            - "**/internal/iam/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business/
              desc: use the business root package, never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media/
              desc: use the media root package, never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: iam must not depend on billing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: iam must not depend on catalog
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: iam must not depend on scheduling
        business-keeps-to-itself:
          files:
            - "**/internal/business/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/booking
              desc: booking depends on business, so business must not depend on booking
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam/
              desc: use the iam root package, never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media/
              desc: use the media root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing/
              desc: use the billing root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: catalog depends on business, so business must not depend on catalog
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: scheduling depends on business, so business must not depend on scheduling
        # catalog asks business who may work on a branch, through its root
        # package in adapters/acl (ADR-0020).
        catalog-keeps-to-itself:
          files:
            - "**/internal/catalog/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/booking
              desc: booking depends on catalog, so catalog must not depend on booking
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business/
              desc: use the business root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: catalog must not depend on iam
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: catalog must not depend on billing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media
              desc: catalog must not depend on media (photos arrive later, through the root package)
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: catalog must not depend on scheduling (booking combines them)
        # scheduling asks business who may work on a branch, through its root
        # package in adapters/acl (ADR-0021).
        scheduling-keeps-to-itself:
          files:
            - "**/internal/scheduling/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/booking
              desc: booking depends on scheduling, so scheduling must not depend on booking
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business/
              desc: use the business root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: scheduling must not depend on iam
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: scheduling must not depend on billing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media
              desc: scheduling must not depend on media
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: scheduling must not depend on catalog (booking combines them)
        # booking combines business, catalog and scheduling, through their root
        # packages in adapters/acl (M5, ADR-0022).
        booking-keeps-to-itself:
          files:
            - "**/internal/booking/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business/
              desc: use the business root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog/
              desc: use the catalog root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling/
              desc: use the scheduling root package (through adapters/acl), never its internals
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: booking must not depend on iam
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: booking must not depend on billing
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media
              desc: booking must not depend on media
        # billing depends on no other module: it hears about businesses through
        # events that main subscribes it to (ADR-0019).
        billing-keeps-to-itself:
          files:
            - "**/internal/billing/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: billing must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business
              desc: billing must not depend on other modules (main wires business events to it)
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media
              desc: billing must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: billing must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: billing must not depend on other modules
        # media is generic: it knows nothing about who stores files or why.
        media-keeps-to-itself:
          files:
            - "**/internal/media/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: media must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business
              desc: media must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: media must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: media must not depend on other modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: media must not depend on other modules
        # Platform plumbing must never depend on business modules.
        platform-has-no-business:
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/iam
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/business
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/booking
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/media
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/billing
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/catalog
              desc: platform code must not import business modules
            - pkg: github.com/Abdulkhaliq-84/barbershop-backend/internal/scheduling
              desc: platform code must not import business modules
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test fixtures use fake credentials on purpose.
      - path: _test\.go
        linters: [gosec]
        text: G101
      # Property tests draw from a seeded math/rand on purpose, so a failing
      # case replays; production code still must use crypto/rand.
      - path: _test\.go
        linters: [gosec]
        text: G404

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt   # stricter gofmt
    - goimports # grouped imports: stdlib, third-party, this module
  settings:
    goimports:
      local-prefixes:
        - github.com/Abdulkhaliq-84/barbershop-backend
